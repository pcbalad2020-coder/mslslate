name: mslslate
description: "مسلسلاتي — مركز مشاهدة الأفلام والمسلسلات"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  android_intent_plus: ^5.2.0
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  chewie: ^1.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0A0F"
  image: "assets/app_icon_foreground.png"
  android_12:
    color: "#0A0A0F"
    image: "assets/app_icon_foreground.png"